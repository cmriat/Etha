[package]
name = "etha"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
python = ">=3.10"
hatchling = "*"

[package.run-dependencies]
python = ">=3.10"
pytorch = "*"

[workspace]
channels = ["conda-forge"]
name = "etha"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[system-requirements]
cuda = "12.9"

[dependencies]
cuda = "12.9.*"
etha = { path = "." }
fastapi = "*"
pyzmq = "*"
uvicorn = "*"
pytorch = { version = "*", build = "cuda*" }
transformers = "*"

[feature.vllm.dependencies]
vllm = { version = "*", build = "cuda*" }

[feature.megatron.dependencies]
# megatron-core = "*"  # placeholder until the integration lands

[feature.dev.dependencies]
pytest = "*"
pytest-timeout = "*"
pre-commit = "*"

[environments]
dev = { features = ["dev"], solve-group = "default" }
vllm = { features = ["vllm"] }
megatron = { features = ["megatron"] }

[tasks]
submit = { cmd = "kjobctl create slurm --first-node-ip -- --chdir $PIXI_PROJECT_ROOT --output $PIXI_PROJECT_ROOT/jobs-%j-%N.log {{ script }}", args = ["script"] }

[feature.dev.tasks]
test = "pytest tests"
